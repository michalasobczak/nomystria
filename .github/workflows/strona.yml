# S007: publikacja strony (strona/ + dane.json z dane/indeks.csv i kontrole/) na GitHub Pages.
name: Strona (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - "dane/indeks.csv"
      - "kontrole/**"
      - "strona/**"
      - "skrypty/strona.py"
      - ".github/workflows/strona.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Zbuduj _site
        run: |
          mkdir -p _site
          cp strona/index.html strona/app.js strona/style.css _site/
          python skrypty/strona.py --out _site/dane.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
